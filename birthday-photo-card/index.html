<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100d20">
  <meta name="robots" content="noindex,nofollow">
  <title>生日全息闪卡</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; overflow-x: hidden; background: radial-gradient(ellipse at 50% 35%, #302341 0%, #171428 48%, #0c0b18 100%); color: #ead8bd; }
    main { display: grid; justify-items: center; gap: 15px; width: 100%; padding: 24px 16px 30px; }
    .scene { perspective: 1100px; width: min(82vw, 380px, calc((100dvh - 116px) * .6667)); aspect-ratio: 2 / 3; filter: drop-shadow(0 22px 32px #0008); }
    .tilt { width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); will-change: transform; }
    .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: rotateY(var(--flip, 0deg)); transition: transform 750ms cubic-bezier(.2,.75,.2,1); border-radius: 4%; cursor: pointer; outline-offset: 7px; touch-action: none; }
    .card:focus-visible { outline: 2px solid #e8c78e; }
    .side { position: absolute; inset: 0; overflow: hidden; border-radius: 4%; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #131329; box-shadow: inset 0 0 0 1px #f5ddad77; }
    .side.back { transform: rotateY(180deg); }
    .art { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; }
    .side::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(circle at var(--px, 50%) var(--py, 50%), rgba(255,244,211,.30), rgba(181,163,255,.09) 18%, transparent 43%); opacity: var(--shine, .18); mix-blend-mode: screen; }
    .side::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(115deg, transparent 20%, rgba(102,224,245,.3) 36%, rgba(255,178,230,.26) 47%, rgba(249,228,145,.28) 59%, transparent 75%); background-size: 190% 100%; background-position: var(--foil-x, 50%) center; opacity: var(--foil, .10); mix-blend-mode: screen; }
    .edge { position: absolute; inset: 1px; border: 1px solid #ffebba88; border-radius: 4%; pointer-events: none; transform: translateZ(1px); }
    .controls { display: flex; align-items: center; gap: 15px; }
    button, a { color: #ebd4aa; font: inherit; font-size: 13px; letter-spacing: .07em; }
    button { padding: 9px 22px; border: 1px solid #e9c78b88; border-radius: 999px; background: #241b32aa; cursor: pointer; }
    button:hover { background: #35263e; }
    a { text-decoration: none; border-bottom: 1px solid #ba9e76; padding-bottom: 2px; }
    .hint { margin: 0; font-size: 12px; color: #b8a9bf; text-align: center; }
    @media (prefers-reduced-motion: reduce) { .card { transition-duration: .01ms; } .tilt { transform: none; } }
  </style>
</head>
<body>
  <main>
    <div class="scene">
      <div class="tilt" id="tilt">
        <div class="card" id="card" role="button" tabindex="0" aria-label="生日卡正面，轻触翻面">
          <div class="side front"><img class="art" src="assets/front.webp" alt="生日闪卡正面：照片中的人物与蝴蝶蛋糕"><span class="edge"></span></div>
          <div class="side back"><img class="art" src="assets/back.webp" alt="生日闪卡背面：星空、金色星月和生日蛋糕"><span class="edge"></span></div>
        </div>
      </div>
    </div>
    <div class="controls"><button id="flip" type="button">翻到背面</button><a href="birthday-card-offline.html" download>下载离线版</a></div>
    <p class="hint">移动鼠标或按住滑动看反光，轻触卡片翻面</p>
  </main>
  <script>
    (() => {
      const card = document.getElementById('card');
      const tilt = document.getElementById('tilt');
      const flipButton = document.getElementById('flip');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)');
      let flipped = false, down = null, dragged = false;
      let x = 0, y = 0, tx = 0, ty = 0, raf = 0;
      function flip() {
        flipped = !flipped;
        card.style.setProperty('--flip', flipped ? '180deg' : '0deg');
        card.setAttribute('aria-label', flipped ? '生日卡背面，轻触翻到正面' : '生日卡正面，轻触翻面');
        flipButton.textContent = flipped ? '翻到正面' : '翻到背面';
      }
      function aim(event) {
        const r = card.getBoundingClientRect();
        tx = Math.max(-1, Math.min(1, ((event.clientX - r.left) / r.width - .5) * 2));
        ty = Math.max(-1, Math.min(1, ((event.clientY - r.top) / r.height - .5) * 2));
        kick();
      }
      function kick() { if (!raf) raf = requestAnimationFrame(frame); }
      function frame() {
        x += (tx - x) * .14; y += (ty - y) * .14;
        tilt.style.setProperty('--rx', `${(-y * 10).toFixed(2)}deg`);
        tilt.style.setProperty('--ry', `${(x * 10).toFixed(2)}deg`);
        card.style.setProperty('--px', `${(50 + x * 42).toFixed(1)}%`);
        card.style.setProperty('--py', `${(50 + y * 42).toFixed(1)}%`);
        card.style.setProperty('--foil-x', `${(50 + x * 40).toFixed(1)}%`);
        card.style.setProperty('--shine', (reduced.matches ? .08 : .18 + (Math.abs(x) + Math.abs(y)) * .26).toFixed(2));
        card.style.setProperty('--foil', (reduced.matches ? .06 : .10 + (Math.abs(x) + Math.abs(y)) * .10).toFixed(2));
        if (Math.abs(tx - x) + Math.abs(ty - y) > .002) raf = requestAnimationFrame(frame);
        else raf = 0;
      }
      card.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; dragged = false; card.setPointerCapture(e.pointerId); aim(e); });
      card.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || down) aim(e); if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) dragged = true; });
      card.addEventListener('pointerup', e => { if (down && !dragged) flip(); down = null; tx = 0; ty = 0; kick(); });
      card.addEventListener('pointercancel', () => { down = null; tx = 0; ty = 0; kick(); });
      card.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !down) { tx = 0; ty = 0; kick(); } });
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
      flipButton.addEventListener('click', flip);
    })();
  </script>
</body>
</html>
