<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校园运动群 | 其他事务</title>
    <style>
        :root {
            --surface: #ffffff;
            --surface-soft: #f6fbf8;
            --border: rgba(45, 111, 73, 0.14);
            --text: #11242f;
            --muted: #5f7b86;
            --primary: #2cae76;
            --primary-dark: #248257;
            --shadow: 0 18px 42px rgba(17, 36, 47, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #f6fbf7 0%, #edf8f2 100%);
            color: var(--text);
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            line-height: 1.7;
        }
        body.modal-open { overflow: hidden; }
        a { color: inherit; text-decoration: none; }
        .topbar { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,0.9); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); }
        .topbar-inner { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 16px 0; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; }
        .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 14px; background: linear-gradient(135deg, #2cae76, #36c08b); color: #fff; font-size: 20px; }
        .nav-links { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 18px; color: var(--muted); font-size: 0.92rem; }
        .nav-links a:hover, .back-link:hover { color: var(--primary-dark); }
        .page-shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 72px; }
        .page-header { margin-bottom: 30px; }
        .back-link { display: inline-block; margin-bottom: 16px; color: var(--primary-dark); font-weight: 600; }
        .page-header h1 { margin: 0 0 10px; font-size: clamp(2.1rem, 4vw, 3rem); line-height: 1.15; }
        .page-header p { margin: 0; color: var(--text); font-size: 1.02rem; overflow-wrap: anywhere; }
        .group-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
        .group-card { min-width: 0; padding: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--shadow); }
        .group-card h2 { margin: 0 0 18px; font-size: 1.35rem; line-height: 1.35; overflow-wrap: anywhere; }
        .qr-button { display: block; width: min(420px, 100%); margin: 0 auto; padding: 0; border: 0; border-radius: 16px; background: var(--surface-soft); cursor: zoom-in; }
        .qr-button img { display: block; width: 100%; height: auto; border: 1px solid rgba(44, 174, 118, 0.16); border-radius: 16px; }
        .image-modal { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(0, 0, 0, 0.72); }
        .image-modal.is-open { display: flex; }
        .image-modal img { max-width: min(94vw, 980px); max-height: 88vh; width: auto; height: auto; object-fit: contain; border-radius: 10px; background: #fff; }
        .image-modal-close { position: absolute; top: 16px; right: 18px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.94); color: var(--text); cursor: pointer; font-size: 1.6rem; line-height: 1; }
        .footer { width: min(1180px, calc(100% - 32px)); margin: 0 auto 32px; padding-top: 18px; border-top: 1px solid rgba(45,111,73,0.14); color: var(--muted); text-align: center; font-size: 0.9rem; }
        .footer p { margin: 0 0 8px; }
        @media (max-width: 760px) {
            .topbar-inner, .page-shell, .footer { width: min(100% - 22px, 1180px); }
            .topbar-inner { flex-direction: column; align-items: flex-start; }
            .nav-links { justify-content: flex-start; gap: 10px 14px; }
            .group-grid { grid-template-columns: 1fr; gap: 14px; }
            .group-card { padding: 20px 16px; }
            .image-modal { padding: 14px; }
            .image-modal img { max-width: 96vw; max-height: 82vh; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="index.html">
                <span class="brand-mark">🐱</span>
                <span>指路猫</span>
            </a>
            <nav class="nav-links" aria-label="主导航">
                <a href="index.html">首页</a>
                <a href="campus-map.html">学校地图</a>
                <a href="other-affairs.html">其他事务</a>
                <a href="zhao.html">反馈建议</a>
            </nav>
        </div>
    </div>

    <main class="page-shell">
        <div class="page-header">
            <a class="back-link" href="other-affairs.html">← 返回其他事务</a>
            <h1>校园运动群</h1>
            <p>学校有我们中国学生自己建的运动群，目前有篮球群和羽毛球群</p>
        </div>

        <section class="group-grid" aria-label="校园运动群">
            <article class="group-card">
                <h2>🏀 IIUM 新生篮球群</h2>
                <button class="qr-button" type="button" data-qr-src="校园/iium-freshman-basketball-qr.jpg" aria-label="查看 IIUM 新生篮球群二维码">
                    <img src="校园/iium-freshman-basketball-qr.jpg" alt="IIUM 新生篮球群二维码" />
                </button>
            </article>
            <article class="group-card">
                <h2>🏸 IIUM 羽毛球群</h2>
                <button class="qr-button" type="button" data-qr-src="校园/iium-badminton-qr.jpg" aria-label="查看 IIUM 羽毛球群二维码">
                    <img src="校园/iium-badminton-qr.jpg" alt="IIUM 羽毛球群二维码" />
                </button>
            </article>
        </section>
    </main>

    <footer class="footer">
        <p>信息持续更新中，发现错误欢迎 <a href="zhao.html">反馈</a>。</p>
        <p>免责声明：信息仅供参考，请以学校实际通知为准。</p>
    </footer>

    <div class="image-modal" role="dialog" aria-modal="true" aria-label="运动群二维码大图">
        <button class="image-modal-close" type="button" aria-label="关闭大图">&times;</button>
        <img src="" alt="" />
    </div>

    <script>
        const imageModal = document.querySelector('.image-modal');
        const imageModalImage = imageModal.querySelector('img');
        const imageModalClose = document.querySelector('.image-modal-close');

        function closeImageModal() {
            imageModal.classList.remove('is-open');
            imageModalImage.removeAttribute('src');
            document.body.classList.remove('modal-open');
        }

        document.querySelectorAll('.qr-button').forEach(function (button) {
            button.addEventListener('click', function () {
                imageModalImage.src = button.dataset.qrSrc;
                imageModalImage.alt = button.querySelector('img').alt;
                imageModal.classList.add('is-open');
                document.body.classList.add('modal-open');
            });
        });

        imageModalClose.addEventListener('click', closeImageModal);
        imageModal.addEventListener('click', function (event) {
            if (event.target === imageModal) {
                closeImageModal();
            }
        });
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && imageModal.classList.contains('is-open')) {
                closeImageModal();
            }
        });
    </script>
</body>
</html>
