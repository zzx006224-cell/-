<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校园食堂 | 指路猫</title>
    <style>
        :root {
            --bg: #f5fbf6;
            --surface: #ffffff;
            --text: #10222f;
            --muted: #5f7d8a;
            --primary: #2cae76;
            --primary-dark: #24915f;
            --accent-blue: #3c8dff;
            --accent-orange: #ff9f49;
            --shadow: 0 22px 60px rgba(16, 34, 47, 0.08);
            --shadow-soft: 0 14px 45px rgba(16, 34, 47, 0.08);
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #f5fbf6 0%, #eef8f3 100%);
            color: var(--text);
            min-height: 100%;
        }

        body {
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button, input {
            font: inherit;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(14px);
            background: rgba(245, 251, 246, 0.86);
            border-bottom: 1px solid rgba(255, 255, 255, 0.7);
            padding: 18px 0;
        }

        .topbar-inner {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: linear-gradient(135deg, #2cae76 0%, #36c08b 100%);
            color: white;
            font-size: 20px;
            box-shadow: var(--shadow-soft);
        }

        .nav-links {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--muted);
            font-size: 15px;
            transition: color .2s ease;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .page-wrapper {
            max-width: 1240px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            margin: 0 0 12px;
            font-size: clamp(2.2rem, 3.5vw, 3.2rem);
            line-height: 1.1;
        }

        .header p {
            margin: 0;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .stat-item {
            padding: 12px 20px;
            border-radius: 999px;
            background: rgba(44, 174, 118, 0.12);
            color: var(--primary-dark);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
        }

        .search-box {
            width: 100%;
            max-width: 520px;
        }

        .search-box input {
            width: 100%;
            padding: 18px 24px;
            border-radius: 24px;
            border: 1px solid rgba(45, 111, 73, 0.14);
            background: rgba(255, 255, 255, 0.92);
            color: var(--text);
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease;
            font-size: 1rem;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(44, 174, 118, 0.14);
        }

        .canteen-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
            margin-bottom: 40px;
            align-items: start;
        }

        .canteen-card {
            background: var(--surface);
            border-radius: 24px;
            border: 1px solid rgba(45, 111, 73, 0.08);
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
            cursor: pointer;
            align-self: start;
        }

        .canteen-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 26px 55px rgba(16, 34, 47, 0.12);
            border-color: rgba(44, 174, 118, 0.2);
        }

        .canteen-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, rgba(44, 174, 118, 0.12), rgba(60, 141, 255, 0.12));
            display: grid;
            place-items: center;
            font-size: 3.5rem;
        }

        .canteen-body {
            padding: 24px;
        }

        .canteen-title {
            margin: 0 0 8px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .canteen-subtitle {
            margin: 0 0 16px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .canteen-intro {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .canteen-detail {
            display: none;
            padding: 20px 24px;
            border-top: 1px solid rgba(45, 111, 73, 0.08);
            background: #fafbf9;
        }

        .canteen-card.expanded .canteen-detail {
            display: block;
        }

        .detail-item {
            margin-bottom: 16px;
        }

        .detail-item:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            font-weight: 600;
            color: var(--primary-dark);
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .detail-value {
            color: var(--text);
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-word;
        }

        .map-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 12px 18px;
            border: 1px solid var(--accent-blue);
            border-radius: 16px;
            background: rgba(60, 141, 255, 0.08);
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background .2s ease, transform .2s ease;
            text-decoration: none;
        }

        .map-button:hover {
            background: rgba(60, 141, 255, 0.16);
            transform: translateY(-1px);
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .no-results h3 {
            font-size: 1.3rem;
            margin: 0 0 12px;
        }

        .no-results p {
            margin: 0;
            font-size: 1rem;
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(45, 111, 73, 0.08);
            color: var(--muted);
            font-size: 0.95rem;
        }

        .footer p {
            margin: 8px 0;
        }

        .footer a {
            color: var(--primary);
            font-weight: 600;
            transition: color .2s ease;
        }

        .footer a:hover {
            color: var(--primary-dark);
        }

        @media (max-width: 1024px) {
            .canteen-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .canteen-grid {
                grid-template-columns: 1fr;
            }

            .page-wrapper {
                padding: 28px 16px 40px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .topbar-inner {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                justify-content: flex-start;
            }
        }
    </style>
</head>

        // Set update time
        const today = new Date();
        const dateStr = today.getFullYear() + '-' + 
                       String(today.getMonth() + 1).padStart(2, '0') + '-' + 
                       String(today.getDate()).padStart(2, '0');
        updateTimeEl.textContent = dateStr;

        function renderCanteens(items) {
            grid.innerHTML = '';
            if (items.length === 0) {
                noResults.style.display = 'block';
                return;
            }
            noResults.style.display = 'none';
            
            items.forEach(canteen => {
                const card = document.createElement('div');
                card.className = 'canteen-card';
                card.innerHTML = `
                    <div class="canteen-image">🍜</div>
                    <div class="canteen-body">
                        <h3 class="canteen-title">${canteen.name}</h3>
                        <p class="canteen-subtitle">${canteen.location}</p>
                        <p class="canteen-intro">${canteen.intro}</p>
                    </div>
                    <div class="canteen-detail">
                        <div class="detail-item">
                            <div class="detail-label">💼 营业时间</div>
                            <div class="detail-value">${canteen.time}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">📝 详情</div>
                            <div class="detail-value">${canteen.description}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">🗺 位置说明</div>
                            <div class="detail-value">${canteen.directions}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">💬 联系方式</div>
                            <div class="detail-value">${canteen.wechat}</div>
                        </div>
                        ${canteen.mapKeyword !== '无' ? `
                        <a href="https://www.google.com/maps/search/${encodeURIComponent(canteen.mapKeyword)}" target="_blank" class="map-button">
                            🗺 打开地图
                        </a>
                        ` : ''}
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    card.classList.toggle('expanded');
                });
                
                grid.appendChild(card);
            });
        }

        function filterCanteens(query) {
            if (!query.trim()) {
                renderCanteens(canteens);
                return;
            }
            
            const filtered = canteens.filter(c => 
                c.name.toLowerCase().includes(query.toLowerCase()) ||
                c.location.toLowerCase().includes(query.toLowerCase()) ||
                c.intro.toLowerCase().includes(query.toLowerCase())
            );
            
            renderCanteens(filtered);
        }

        searchInput.addEventListener('input', (e) => {
            filterCanteens(e.target.value);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                filterCanteens(e.target.value);
            }
        });

        // Initial render
        renderCanteens(canteens);
