<body>
    <div class="topbar">

            <a class="brand" href="index.html">

            </a>
            <nav class="nav-links" aria-label="主导航">

        <header class="page-header">
            <span class="eyebrow" aria-hidden="true">🏫</span>
            <h1>各大院系的主任和院长</h1>
            <span class="directory-english" lang="en">Deans &amp; Heads of Departments</span>
            <p>快速查找学院院长、系主任和相关负责人。</p>
        </header>
        <section class="content-card directory-search" aria-label="人物与学院搜索">
            <label for="faculty-search">人物 / 学院搜索</label>
            <input id="faculty-search" type="search" placeholder="搜索学院、院长、系主任……" autocomplete="off" aria-controls="faculty-list" />
            <p>目前展示部分学院，名单及负责人资料整理中。已录入资料可按学院简称、全称、姓名、系或职位查找。</p>
            <p id="faculty-count" role="status" aria-live="polite">正在加载资料……</p>
        </section>
        <div id="faculty-list" class="faculty-list"></div>
        <div id="faculty-empty" class="content-card directory-empty" hidden><h2>未找到匹配资料</h2><p>试试学院简称或其他搜索词。负责人信息仍在整理中，未匹配不代表该学院没有相关负责人。</p></div>
        <noscript><p class="content-card">请启用 JavaScript 以查看学院卡片和使用搜索。负责人资料整理中。</p></noscript>

    <footer class="footer">
